services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forkd
      POSTGRES_PASSWORD: forkd
      POSTGRES_DB: forkd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forkd"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
